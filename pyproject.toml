[project]
name = "easyclipper"
version = "0.1.0"
description = "使用本地 FFmpeg 的简易视频剪辑工具"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
easyclipper = "easyclipper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easyclipper"]
